[workspace]
resolver = "3"
members = ["crates/core", "crates/native", "crates/ui", "apps/oxdrive"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/nikolainyegaard/oxdrive"

[workspace.dependencies]
oxdrive-core = { path = "crates/core" }
oxdrive-native = { path = "crates/native" }
oxdrive-ui = { path = "crates/ui" }
iced = { version = "0.14", default-features = false, features = ["wgpu", "wayland", "thread-pool", "svg"] }
iced_exwlshell = "0.21"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
futures = "0.3"
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
resvg = { version = "0.45", default-features = false, features = ["raster-images"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
